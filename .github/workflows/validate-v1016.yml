name: Validate Miracle v1.0.16 fixes

on:
  push:
    branches:
      - fix-v1016-scan-metadata
    paths:
      - '.github/workflows/validate-v1016.yml'
      - '.github/fix_v1016.py'
      - '.github/fix_v1016_escapes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify TMDB key
        shell: bash
        run: |
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::error::TMDB_API_KEY is missing"
            exit 1
          fi

      - name: Apply v1.0.16 fixes
        run: |
          python3 .github/fix_v1016.py
          python3 .github/fix_v1016_escapes.py

      - name: Build and validate APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated source changes
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/com/miracle/kglaynyi/adapter/IndexAdapter.java \
            app/src/main/java/com/miracle/kglaynyi/utils/GdiJsIndexClient.java \
            app/src/main/java/com/miracle/kglaynyi/utils/SendGetRequestTMDB.java
          git diff --cached --quiet && exit 0
          git commit -m "Fix scan progress and rebuild media metadata"
          git push origin HEAD:fix-v1016-scan-metadata
