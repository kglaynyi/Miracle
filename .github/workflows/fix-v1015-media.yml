name: Validate Miracle v1.0.15 media fixes

on:
  push:
    branches:
      - fix-v1015-media-categories
    paths:
      - '.github/workflows/fix-v1015-media.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply fixes
        run: python3 .github/fix_v1015.py

      - name: Build and validate
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated app changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Fix metadata enrichment and classify anime and shows"
          git push origin HEAD:fix-v1015-media-categories
