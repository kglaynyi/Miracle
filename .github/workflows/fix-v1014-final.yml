name: Finalize Miracle v1.0.14

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-v1014-final.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub1(path, pattern, repl, flags=0):
              p=Path(path); s=p.read_text()
              n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n[1] != 1:
                  raise SystemExit(f'patch failed: {path}: {pattern[:100]} matched {n[1]}')
              p.write_text(n[0])

          # GDI-JS: persist a visible Movie row as soon as a video is discovered.
          gdi='app/src/main/java/com/miracle/kglaynyi/utils/GdiJsIndexClient.java'
          sub1(gdi, re.escape('discoverFolder(apiRoot, session.cookie, visitedFolders, videoEntries, stats, listener);'),
                    'discoverFolder(apiRoot, session.cookie, visitedFolders, videoEntries, stats, indexId, tvShows, listener);')
          sub1(gdi, r'int\[\] stats,\s*ProgressListener listener\) throws Exception \{',
                    'int[] stats, int indexId, boolean tvShows, ProgressListener listener) throws Exception {')
          sub1(gdi, re.escape('discoverFolder(child, cookie, visitedFolders, videoEntries, stats, listener);'),
                    'discoverFolder(child, cookie, visitedFolders, videoEntries, stats, indexId, tvShows, listener);')
          sub1(gdi, r'(stats\[2\]\+\+;\s*)(videoEntries\.add\(new VideoEntry\(folderUrl, file\)\);)',
                    r'\1if (!tvShows) saveDiscoveredPlaceholder(folderUrl, file, indexId);\n                            \2')
          helper='''    private static void saveDiscoveredPlaceholder(String folderUrl, File file, int indexId) {
              if (file == null) return;
              String gdId = file.getId();
              Movie existing = (gdId == null || gdId.trim().isEmpty()) ? null :
                      DatabaseClient.getInstance(context).getAppDatabase().movieDao().getByGdId(gdId);
              if (existing != null) return;

              Movie movie = new Movie();
              movie.setFileName(file.getName());
              movie.setMimeType(file.getMimeType());
              movie.setModifiedTime(file.getModifiedTime());
              movie.setSize(file.getSize());
              movie.setUrlString(resolveFileUrl(folderUrl, folderUrl, file));
              movie.setGd_id(gdId == null ? "" : gdId);
              movie.setIndex_id(indexId);
              String title = fallbackMovieTitle(file.getName());
              movie.setTitle(title);
              movie.setOriginal_title(title);
              DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);
          }

          '''
          sub1(gdi, r'(?=    private static void processVideo\(String rootUrl, String folderUrl, File file,)', helper)

          # TMDB failure/no result must never create a hidden null-title movie.
          tmdb='app/src/main/java/com/miracle/kglaynyi/utils/SendGetRequestTMDB.java'
          sub1(tmdb,
               r'(System\.out\.println\("file with no tmdb info" \+ movie\);\s*)(DatabaseClient\.getInstance\(context\)\.getAppDatabase\(\)\.movieDao\(\)\.insert\(movie\);)',
               r'\1ensureFallbackMovieTitle(movie);\n            \2')
          title_helper='''    private static void ensureFallbackMovieTitle(Movie movie) {
              if (movie == null || (movie.getTitle() != null && !movie.getTitle().trim().isEmpty())) return;
              String name = movie.getFileName();
              if (name == null || name.trim().isEmpty()) name = "Untitled Video";
              int dot = name.lastIndexOf('.');
              if (dot > 0) name = name.substring(0, dot);
              name = name.replace('.', ' ').replace('_', ' ').trim();
              while (name.contains("  ")) name = name.replace("  ", " ");
              if (name.isEmpty()) name = "Untitled Video";
              movie.setTitle(name);
              movie.setOriginal_title(name);
          }

          '''
          sub1(tmdb, r'(?=    private static String searchMovieOnTmdbByName\()', title_helper)
          sub1(tmdb,
               r'movie\s*=\s*gson\.fromJson\(responseById\.toString\(\)\s*,\s*Movie\.class\);\s*\}\s*catch\s*\(NumberFormatException e\)\s*\{\s*System\.out\.println\("NumberFormatException" \+ e\);\s*\}',
               '''Movie parsedMovie = gson.fromJson(responseById.toString(), Movie.class);
                  if (parsedMovie != null) movie = parsedMovie;
                  else ensureFallbackMovieTitle(movie);
              } catch (Exception e) {
                  System.out.println("TMDB movie parse failed " + e);
                  ensureFallbackMovieTitle(movie);
              }''', flags=re.S)

          # Persist scan progress outside RecyclerView rows so tab changes do not reset it.
          iu=Path('app/src/main/java/com/miracle/kglaynyi/utils/IndexUtils.java')
          s=iu.read_text()
          s=s.replace('import java.util.List;','import java.util.List;\nimport java.util.Map;\nimport java.util.concurrent.ConcurrentHashMap;')
          s=s.replace('public class IndexUtils {','''public class IndexUtils {

              private static final Map<Integer, GdiJsIndexClient.Progress> SCAN_PROGRESS = new ConcurrentHashMap<>();

              public static GdiJsIndexClient.Progress getScanProgress(int indexId) {
                  return SCAN_PROGRESS.get(indexId);
              }

              private static void publishProgress(int indexId, GdiJsIndexClient.ProgressListener listener,
                                                  GdiJsIndexClient.Progress progress) {
                  SCAN_PROGRESS.put(indexId, progress);
                  if (listener != null) listener.onProgress(progress);
              }''',1)
          s=s.replace('GdiJsIndexClient.scan(link, user, pass, tvShows, id, listener);',
                      'GdiJsIndexClient.scan(link, user, pass, tvShows, id, progress -> publishProgress(id, listener, progress));')
          s=s.replace('notifyProgress(listener, GdiJsIndexClient.Progress.status(',
                      'publishProgress(id, listener, GdiJsIndexClient.Progress.status(',1)
          s=s.replace('notifyProgress(listener, GdiJsIndexClient.Progress.done(',
                      'publishProgress(id, listener, GdiJsIndexClient.Progress.done(',1)
          # Store errors too. progress index is saved id in normal operation; fall back to requested id.
          s=s.replace('notifyProgress(listener, GdiJsIndexClient.Progress.failed(\n                        "Refresh failed • " + message));',
                      'publishProgress(indexLink.getId(), listener, GdiJsIndexClient.Progress.failed(\n                        "Refresh failed • " + message));')
          iu.write_text(s)

          # RecyclerView card resumes current progress when recreated.
          ia=Path('app/src/main/java/com/miracle/kglaynyi/adapter/IndexAdapter.java')
          s=ia.read_text()
          s=s.replace('import static com.miracle.kglaynyi.utils.IndexUtils.getNoOfMedia;',
                      'import static com.miracle.kglaynyi.utils.IndexUtils.getNoOfMedia;\nimport static com.miracle.kglaynyi.utils.IndexUtils.getScanProgress;')
          s=s.replace('''        int noOfMedia = getNoOfMedia(holder.itemView.getContext(), t);
              holder.noOfMedia.setText(noOfMedia + " " + t.getFolderType());
              holder.refreshIndex.setEnabled(true);''',
                      '        bindProgress(holder, t);')
          insert='''    private void bindProgress(IndexViewHolder holder, IndexLink indexLink) {
              if (holder.progressRunnable != null) mainHandler.removeCallbacks(holder.progressRunnable);
              holder.boundIndexId = indexLink.getId();
              holder.progressRunnable = new Runnable() {
                  @Override public void run() {
                      if (holder.getBindingAdapterPosition() == RecyclerView.NO_POSITION || holder.boundIndexId != indexLink.getId()) return;
                      com.miracle.kglaynyi.utils.GdiJsIndexClient.Progress progress = getScanProgress(indexLink.getId());
                      if (progress != null && !progress.finished) {
                          holder.noOfMedia.setText(progress.message);
                          holder.refreshIndex.setEnabled(false);
                          mainHandler.postDelayed(this, 500);
                      } else if (progress != null && progress.error) {
                          holder.noOfMedia.setText(progress.message);
                          holder.refreshIndex.setEnabled(true);
                      } else {
                          holder.noOfMedia.setText(getNoOfMedia(holder.itemView.getContext(), indexLink) + " " + indexLink.getFolderType());
                          holder.refreshIndex.setEnabled(true);
                      }
                  }
              };
              holder.progressRunnable.run();
          }

              @Override public void onViewRecycled(IndexViewHolder holder) {
              if (holder.progressRunnable != null) mainHandler.removeCallbacks(holder.progressRunnable);
              super.onViewRecycled(holder);
          }

          '''
          s=s.replace('    @Override\n    public int getItemCount() {',insert+'    @Override\n    public int getItemCount() {',1)
          s=s.replace('        SwitchCompat enableIndex;','        SwitchCompat enableIndex;\n        Runnable progressRunnable;\n        int boundIndexId;',1)
          # After pressing refresh, start the holder poller immediately.
          s=s.replace('            holder.noOfMedia.setText("Connecting…");\n\n            refreshIndex(context, t, progress -> {',
                      '            holder.noOfMedia.setText("Connecting…");\n            if (holder.progressRunnable != null) mainHandler.postDelayed(holder.progressRunnable, 200);\n\n            refreshIndex(context, t, progress -> {',1)
          ia.write_text(s)

          # Library must reload DB whenever revisited; do not keep the first empty list forever.
          lib='app/src/main/java/com/miracle/kglaynyi/fragments/MovieLibraryFragment.java'
          sub1(lib, r'\s*if\s*\(movieList\s*==\s*null\)\s*\{\s*(movieList\s*=\s*DatabaseClient.*?\.movieDao\(\)\.getAll\(\);)\s*\}', r'\n                \1', flags=re.S)
          sub1(lib, r'(?=    void showLibraryMovies\(\) \{)', '''    @Override
              public void onResume() {
              super.onResume();
              if (getView() != null) showLibraryMovies();
          }

          ''')

          # Home reloads its DB sections when the tab is revisited.
          home='app/src/main/java/com/miracle/kglaynyi/fragments/HomeFragment.java'
          home_resume='''    @Override
              public void onResume() {
              super.onResume();
              if (getView() == null) return;
              loadRecentlyAddedMovies();
              loadRecentlyReleasedMovies();
              loadTopRatedMovies();
              loadLastPlayedMovies();
              loadWatchlist();
              loadNewSeason();
              loadTopRatedShows();
          }

          '''
          sub1(home, r'(?=    private void loadWatchlist\(\) \{)', home_resume)

          # v1.0.14 + concise release notes.
          sub1('app/build.gradle', r'versionCode\s+7\s*\n\s*versionName\s+"1\.0\.13"', 'versionCode 8\n        versionName "1.0.14"')
          wf=Path('.github/workflows/release-apk.yml'); ws=wf.read_text().splitlines()
          for i,line in enumerate(ws):
              if line.strip().startswith('NOTES="'):
                  ws[i]='          NOTES="Fixes movie/poster loading, persistent scan progress across tabs, and faster library updates during scanning."'
                  break
          else: raise SystemExit('release NOTES line not found')
          wf.write_text('\n'.join(ws)+'\n')
          PY

      - name: Build and validate
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean release history notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            body="$(gh release view "$tag" --json body --jq '.body // ""')"
            cleaned="$(printf '%s' "$body" | sed -E 's/[[:space:]]*Package: com\.miracle\.kglaynyi\. Based on Thunder by anujd64 and distributed under GPL-3\.0\.//g')"
            [ "$body" = "$cleaned" ] || gh release edit "$tag" --notes "$cleaned"
          done

      - name: Commit validated fixes
        shell: bash
        run: |
          rm -f .github/workflows/fix-v1014.yml .github/workflows/fix-v1014-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix movie loading and persistent scan progress"
          git push origin HEAD:main
