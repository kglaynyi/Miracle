name: Restore Miracle Android Project

on:
  push:
    paths:
      - '.github/workflows/restore-miracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Restore missing Android project files from upstream Thunder
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/anujd64/Thunder.git /tmp/thunder
          rm -rf app
          cp -a /tmp/thunder/app ./app
          cp /tmp/thunder/gradlew ./gradlew
          cp /tmp/thunder/gradlew.bat ./gradlew.bat
          cp /tmp/thunder/.gitignore ./.gitignore
          chmod +x ./gradlew

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('settings.gradle')
          text = settings.read_text()
          text = re.sub(r'rootProject\.name\s*=\s*["\']Thunder["\']', 'rootProject.name = "Miracle"', text)
          settings.write_text(text)

          strings = Path('app/src/main/res/values/strings.xml')
          if strings.exists():
              text = strings.read_text()
              text = re.sub(r'(<string\s+name=["\']app_name["\']>).*?(</string>)', r'\1Miracle\2', text, count=1)
              strings.write_text(text)
          PY

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit restored source
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app gradlew gradlew.bat .gitignore settings.gradle
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
          else
            git commit -m "Restore Android source and rename project to Miracle"
            git push origin HEAD:main
          fi

      - name: Report build failure after preserving repair commit
        if: steps.build.outcome == 'failure'
        run: |
          echo "Android source was restored, but the Gradle build still needs follow-up fixes."
          exit 1
