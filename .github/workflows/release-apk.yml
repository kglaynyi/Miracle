name: Release Miracle APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          VERSION="v1.0.8"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Miracle-${VERSION}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Miracle-${VERSION}.apk" --clobber
          else
            gh release create "$VERSION" "Miracle-${VERSION}.apk" \
              --title "Miracle $VERSION" \
              --notes "Startup stability fix: hardened GitHub update checks, switched update source to Miracle releases, and added a fallback when RenderScript blur is unsupported. Package: com.miracle.kglaynyi. Based on Thunder by anujd64 and distributed under GPL-3.0."
          fi
