name: Release Miracle APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-apk.yml'
      - 'app/build.gradle'
      - 'app/src/main/java/com/miracle/kglaynyi/Constants.java'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify TMDB API key secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::error::Repository secret TMDB_API_KEY is not configured."
            exit 1
          fi
          echo "TMDB API key secret is configured."

      - name: Prepare stable test signing directory
        run: mkdir -p ~/.android

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miracle-debug-signing-key-v1

      - name: Build installable APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Could not determine versionName"
            exit 1
          fi
          VERSION="v${VERSION_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Miracle-${VERSION}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          NOTES="Fixes TMDB poster/detail replacement, auto-detects episodic content, and separates Movies, TV Shows, and Anime."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Miracle-${VERSION}.apk" --clobber
          else
            gh release create "$VERSION" "Miracle-${VERSION}.apk" \
              --title "Miracle $VERSION" \
              --notes "$NOTES"
          fi
