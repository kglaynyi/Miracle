              private void loadWatchlist() {''')

          # Version + short future release notes.
          replace_once('app/build.gradle',
                       'versionCode 7\n        versionName "1.0.13"',
                       'versionCode 8\n        versionName "1.0.14"')
          release = Path('.github/workflows/release-apk.yml')
          text = release.read_text()
          old_prefix = '          NOTES="'
          line = next((ln for ln in text.splitlines() if ln.startswith(old_prefix)), None)
          if line is None:
              raise SystemExit('Release NOTES line not found')
          text = text.replace(line,
              '          NOTES="Fixes movie/poster loading, persistent scan progress across tabs, and faster visible library updates during GDI-JS scans."', 1)
          release.write_text(text)
          PY

      - name: Build and validate
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean old release-note boilerplate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            body="$(gh release view "$tag" --json body --jq '.body // ""')"
            cleaned="$(printf '%s' "$body" | sed -E 's/[[:space:]]*Package: com\.miracle\.kglaynyi\. Based on Thunder by anujd64 and distributed under GPL-3\.0\.//g')"
            if [ "$cleaned" != "$body" ]; then
              gh release edit "$tag" --notes "$cleaned"
            fi
          done

      - name: Commit tested fixes
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/fix-v1014.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix library population and persistent scan progress"
          git push origin HEAD:main
