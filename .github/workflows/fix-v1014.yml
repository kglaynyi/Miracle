name: Fix Miracle v1.0.14

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v1014.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply v1.0.14 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Save discovered movies immediately, then enrich them with TMDB later.
          gdi = 'app/src/main/java/com/miracle/kglaynyi/utils/GdiJsIndexClient.java'
          replace_once(gdi,
          '''                        if (isVideoFile(file)) {
                              stats[2]++;
                              videoEntries.add(new VideoEntry(folderUrl, file));
                          }
          ''',
          '''                        if (isVideoFile(file)) {
                              stats[2]++;
                              saveDiscoveredPlaceholder(folderUrl, file);
                              videoEntries.add(new VideoEntry(folderUrl, file));
                          }
          ''')

          replace_once(gdi,
          '''    private static void processVideo(String rootUrl, String folderUrl, File file,
                                       boolean tvShows, int indexId) {
          ''',
          '''    private static void saveDiscoveredPlaceholder(String folderUrl, File file) {
              if (file == null) return;
              String id = file.getId();
              if (id != null && !id.trim().isEmpty()
                      && DatabaseClient.getInstance(context).getAppDatabase().movieDao().getByGdId(id) != null) {
                  return;
              }

              Movie movie = new Movie();
              movie.setFileName(file.getName());
              movie.setMimeType(file.getMimeType());
              movie.setModifiedTime(file.getModifiedTime());
              movie.setSize(file.getSize());
              movie.setUrlString(resolveFileUrl(folderUrl, folderUrl, file));
              movie.setGd_id(id == null ? "" : id);
              String title = fallbackMovieTitle(file.getName());
              movie.setTitle(title);
              movie.setOriginal_title(title);
              DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);
          }

              private static void processVideo(String rootUrl, String folderUrl, File file,
                                       boolean tvShows, int indexId) {
          ''')

          # Placeholder needs the correct index id; set it where discovered.
          replace_once(gdi,
          '''    private static void discoverFolder(String folderUrl, String cookie,
                                         Set<String> visitedFolders, List<VideoEntry> videoEntries,
                                         int[] stats, ProgressListener listener) throws Exception {
          ''',
          '''    private static int activeIndexId = 0;

              private static void discoverFolder(String folderUrl, String cookie,
                                         Set<String> visitedFolders, List<VideoEntry> videoEntries,
                                         int[] stats, ProgressListener listener) throws Exception {
          ''')
          replace_once(gdi,
          '''        String apiRoot = getDefaultApiRoot(baseUrl);
              Set<String> visitedFolders = new HashSet<>();
          ''',
          '''        String apiRoot = getDefaultApiRoot(baseUrl);
              activeIndexId = indexId;
              Set<String> visitedFolders = new HashSet<>();
          ''')
          replace_once(gdi,
          '''        movie.setGd_id(id == null ? "" : id);
              String title = fallbackMovieTitle(file.getName());
          ''',
          '''        movie.setGd_id(id == null ? "" : id);
              movie.setIndex_id(activeIndexId);
              String title = fallbackMovieTitle(file.getName());
          ''')

          # 2) TMDB failure/no match must still leave a visible movie.
          tmdb = 'app/src/main/java/com/miracle/kglaynyi/utils/SendGetRequestTMDB.java'
          replace_once(tmdb,
          '''        else if (movie.getTitle() == null) {
              System.out.println("file with no tmdb info" + movie);
              DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);
          }
              }

              private static String searchMovieOnTmdbByName(String titleExtracted , String yearExtracted) {
          ''',
          '''        else if (movie.getTitle() == null) {
              System.out.println("file with no tmdb info" + movie);
              ensureFallbackMovieTitle(movie);
              DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);
          }
              }

              private static void ensureFallbackMovieTitle(Movie movie) {
              if (movie == null || (movie.getTitle() != null && !movie.getTitle().trim().isEmpty())) return;
              String name = movie.getFileName();
              if (name == null || name.trim().isEmpty()) name = "Untitled Video";
              int dot = name.lastIndexOf('.');
              if (dot > 0) name = name.substring(0, dot);
              name = name.replace('.', ' ').replace('_', ' ').replaceAll("\\\\s+", " ").trim();
              if (name.isEmpty()) name = "Untitled Video";
              movie.setTitle(name);
              movie.setOriginal_title(name);
          }

              private static String searchMovieOnTmdbByName(String titleExtracted , String yearExtracted) {
          ''')

          replace_once(tmdb,
          '''        try {
              Gson gson = new Gson();
              movie = gson.fromJson(responseById.toString() , Movie.class);
          } catch (NumberFormatException e) {
              System.out.println("NumberFormatException" + e);
          }


              movie.setFileName(fileName);
          ''',
          '''        try {
              Gson gson = new Gson();
              Movie parsedMovie = gson.fromJson(responseById.toString() , Movie.class);
              if (parsedMovie != null) {
                  movie = parsedMovie;
              } else {
                  ensureFallbackMovieTitle(movie);
              }
          } catch (Exception e) {
              System.out.println("TMDB movie parse failed " + e);
              ensureFallbackMovieTitle(movie);
          }


              movie.setFileName(fileName);
          ''')

          # 3) Persist current scan progress outside the RecyclerView row.
          idx = 'app/src/main/java/com/miracle/kglaynyi/utils/IndexUtils.java'
          replace_once(idx,
          '''import java.util.List;

          public class IndexUtils {
          ''',
          '''import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;

          public class IndexUtils {

              private static final Map<Integer, GdiJsIndexClient.Progress> SCAN_PROGRESS = new ConcurrentHashMap<>();

              public static GdiJsIndexClient.Progress getScanProgress(int indexId) {
                  return SCAN_PROGRESS.get(indexId);
              }
          ''')
          replace_once(idx,
          '''                if ("GDI-JS".equals(indexType)) {
                      GdiJsIndexClient.scan(link, user, pass, tvShows, id, listener);
                      return;
                  }
          ''',
          '''                if ("GDI-JS".equals(indexType)) {
                      GdiJsIndexClient.scan(link, user, pass, tvShows, id,
                              progress -> publishProgress(id, listener, progress));
                      return;
                  }
          ''')
          replace_once(idx,
          '''                notifyProgress(listener, GdiJsIndexClient.Progress.status(
                          "Refreshing index…", -1, 0, 0, 0, 0, 0, 0));
          ''',
          '''                publishProgress(id, listener, GdiJsIndexClient.Progress.status(
                          "Refreshing index…", -1, 0, 0, 0, 0, 0, 0));
          ''')
          replace_once(idx,
          '''                notifyProgress(listener, GdiJsIndexClient.Progress.done(
                          "Refresh complete • " + count + " items", count, 0, count));
          ''',
          '''                publishProgress(id, listener, GdiJsIndexClient.Progress.done(
                          "Refresh complete • " + count + " items", count, 0, count));
          ''')
          replace_once(idx,
          '''    private static void notifyProgress(GdiJsIndexClient.ProgressListener listener,
                                         GdiJsIndexClient.Progress progress) {
              if (listener != null) listener.onProgress(progress);
          }
          ''',
          '''    private static void publishProgress(int indexId,
                                          GdiJsIndexClient.ProgressListener listener,
                                          GdiJsIndexClient.Progress progress) {
              SCAN_PROGRESS.put(indexId, progress);
              notifyProgress(listener, progress);
          }

              private static void notifyProgress(GdiJsIndexClient.ProgressListener listener,
                                         GdiJsIndexClient.Progress progress) {
              if (listener != null) listener.onProgress(progress);
          }
          ''')

          # 4) Manage Indexes restores and keeps polling persistent progress after tab switches.
          adapter = 'app/src/main/java/com/miracle/kglaynyi/adapter/IndexAdapter.java'
          replace_once(adapter,
          '''import static com.miracle.kglaynyi.utils.IndexUtils.getNoOfMedia;
          import static com.miracle.kglaynyi.utils.IndexUtils.refreshIndex;
          ''',
          '''import static com.miracle.kglaynyi.utils.IndexUtils.getNoOfMedia;
          import static com.miracle.kglaynyi.utils.IndexUtils.getScanProgress;
          import static com.miracle.kglaynyi.utils.IndexUtils.refreshIndex;
          ''')
          replace_once(adapter,
          '''        int noOfMedia = getNoOfMedia(holder.itemView.getContext(), t);
              holder.noOfMedia.setText(noOfMedia + " " + t.getFolderType());
              holder.refreshIndex.setEnabled(true);
          ''',
          '''        bindProgress(holder, t);
          ''')
          replace_once(adapter,
          '''            holder.noOfMedia.setText("Connecting…");

              refreshIndex(context, t, progress -> {
          ''',
          '''            holder.noOfMedia.setText("Connecting…");
              if (holder.progressRunnable != null) {
                  mainHandler.postDelayed(holder.progressRunnable, 200);
              }

              refreshIndex(context, t, progress -> {
          ''')
          replace_once(adapter,
          '''    @Override
              public int getItemCount() {
          ''',
          '''    private void bindProgress(IndexViewHolder holder, IndexLink indexLink) {
              if (holder.progressRunnable != null) {
                  mainHandler.removeCallbacks(holder.progressRunnable);
              }
              holder.boundIndexId = indexLink.getId();
              holder.progressRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (holder.getBindingAdapterPosition() == RecyclerView.NO_POSITION
                              || holder.boundIndexId != indexLink.getId()) return;

                      com.miracle.kglaynyi.utils.GdiJsIndexClient.Progress progress =
                              getScanProgress(indexLink.getId());
                      if (progress != null && !progress.finished) {
                          holder.noOfMedia.setText(progress.message);
                          holder.refreshIndex.setEnabled(false);
                          mainHandler.postDelayed(this, 500);
                      } else if (progress != null && progress.error) {
                          holder.noOfMedia.setText(progress.message);
                          holder.refreshIndex.setEnabled(true);
                      } else {
                          int count = getNoOfMedia(holder.itemView.getContext(), indexLink);
                          holder.noOfMedia.setText(count + " " + indexLink.getFolderType());
                          holder.refreshIndex.setEnabled(true);
                      }
                  }
              };
              holder.progressRunnable.run();
          }

              @Override
              public void onViewRecycled(IndexViewHolder holder) {
              if (holder.progressRunnable != null) {
                  mainHandler.removeCallbacks(holder.progressRunnable);
              }
              super.onViewRecycled(holder);
          }

              @Override
              public int getItemCount() {
          ''')
          replace_once(adapter,
          '''        SwitchCompat enableIndex;

              public IndexViewHolder(View itemView) {
          ''',
          '''        SwitchCompat enableIndex;
              Runnable progressRunnable;
              int boundIndexId;

              public IndexViewHolder(View itemView) {
          ''')

          # 5) Library must reload database instead of caching the first empty result forever.
          library = 'app/src/main/java/com/miracle/kglaynyi/fragments/MovieLibraryFragment.java'
          replace_once(library,
          '''    void showLibraryMovies() {
              setOnClickListner();
          ''',
          '''    @Override
              public void onResume() {
              super.onResume();
              if (getView() != null) showLibraryMovies();
          }

              void showLibraryMovies() {
              setOnClickListner();
          ''')
          replace_once(library,
          '''                if(movieList ==null){

                      movieList = DatabaseClient
                              .getInstance(mActivity)
                              .getAppDatabase()
                              .movieDao().getAll();
                  }
                  showRecyclerMovies(movieList);
          ''',
          '''                movieList = DatabaseClient
                          .getInstance(mActivity)
                          .getAppDatabase()
                          .movieDao().getAll();
                  showRecyclerMovies(movieList);
          ''')

          # 6) Home reloads when revisited so newly enriched posters appear.
          home = 'app/src/main/java/com/miracle/kglaynyi/fragments/HomeFragment.java'
          replace_once(home,
          '''        loadRecentlyAddedMovies();
              loadRecentlyReleasedMovies();
              loadTopRatedMovies();
              loadLastPlayedMovies();
              loadWatchlist();
              loadNewSeason();
              loadTopRatedShows();
              setOnClickListner();
          ''',
          '''        setOnClickListner();
              refreshHomeContent();
          ''')
          replace_once(home,
          '''//        getLists();
          //        loadRecyclerViews();

              }

              private void loadWatchlist() {
          ''',
          '''//        getLists();
          //        loadRecyclerViews();

              }

              @Override
              public void onResume() {
              super.onResume();
              if (getView() != null) refreshHomeContent();
          }

              private void refreshHomeContent() {
              loadRecentlyAddedMovies();
              loadRecentlyReleasedMovies();
              loadTopRatedMovies();
              loadLastPlayedMovies();
              loadWatchlist();
              loadNewSeason();
              loadTopRatedShows();
          }

              private void loadWatchlist() {
          ''')

          # 7) Bump version.
          gradle = 'app/build.gradle'
          replace_once(gradle, 'versionCode 7\n        versionName "1.0.13"',
                              'versionCode 8\n        versionName "1.0.14"')

          # 8) Keep release notes short and remove repeated package/license boilerplate.
          workflow = '.github/workflows/release-apk.yml'
          text = Path(workflow).read_text()
          start = 'NOTES="'
          pos = text.find(start)
          if pos == -1:
              raise SystemExit('Release NOTES assignment not found')
          end = text.find('"\n', pos + len(start))
          if end == -1:
              raise SystemExit('Release NOTES end not found')
          text = text[:pos] + 'NOTES="Fixes movie/poster loading, persistent scan progress across tabs, and faster visible library updates during GDI-JS scans.' + text[end:]
          Path(workflow).write_text(text)
          PY

      - name: Build and validate
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean old release-note boilerplate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            body="$(gh release view "$tag" --json body --jq '.body // ""')"
            cleaned="$(printf '%s' "$body" | sed -E 's/[[:space:]]*Package: com\.miracle\.kglaynyi\. Based on Thunder by anujd64 and distributed under GPL-3\.0\.//g')"
            if [ "$cleaned" != "$body" ]; then
              gh release edit "$tag" --notes "$cleaned"
            fi
          done

      - name: Commit tested fixes
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/fix-v1014.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix library population and persistent scan progress"
          git push origin HEAD:main
