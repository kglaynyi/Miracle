name: Fix Miracle v1.0.14

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v1014.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply v1.0.14 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected token not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          gdi = 'app/src/main/java/com/miracle/kglaynyi/utils/GdiJsIndexClient.java'
          replace_once(gdi,
              'discoverFolder(apiRoot, session.cookie, visitedFolders, videoEntries, stats, listener);',
              'discoverFolder(apiRoot, session.cookie, visitedFolders, videoEntries, stats, indexId, tvShows, listener);')
          replace_once(gdi,
              'int[] stats, ProgressListener listener) throws Exception {',
              'int[] stats, int indexId, boolean tvShows, ProgressListener listener) throws Exception {')
          replace_once(gdi,
              'discoverFolder(child, cookie, visitedFolders, videoEntries, stats, listener);',
              'discoverFolder(child, cookie, visitedFolders, videoEntries, stats, indexId, tvShows, listener);')
          replace_once(gdi,
              'stats[2]++;\n                            videoEntries.add(new VideoEntry(folderUrl, file));',
              'stats[2]++;\n                            if (!tvShows) saveDiscoveredPlaceholder(folderUrl, file, indexId);\n                            videoEntries.add(new VideoEntry(folderUrl, file));')
          marker = '    private static void processVideo(String rootUrl, String folderUrl, File file,\n'
          placeholder = '''    private static void saveDiscoveredPlaceholder(String folderUrl, File file, int indexId) {
              if (file == null) return;
              String gdId = file.getId();
              if (gdId != null && !gdId.trim().isEmpty()
                      && DatabaseClient.getInstance(context).getAppDatabase().movieDao().getByGdId(gdId) != null) {
                  return;
              }
              Movie movie = new Movie();
              movie.setFileName(file.getName());
              movie.setMimeType(file.getMimeType());
              movie.setModifiedTime(file.getModifiedTime());
              movie.setSize(file.getSize());
              movie.setUrlString(resolveFileUrl(folderUrl, folderUrl, file));
              movie.setGd_id(gdId == null ? "" : gdId);
              movie.setIndex_id(indexId);
              String title = fallbackMovieTitle(file.getName());
              movie.setTitle(title);
              movie.setOriginal_title(title);
              DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);
          }

          '''
          replace_once(gdi, marker, placeholder + marker)

          tmdb = 'app/src/main/java/com/miracle/kglaynyi/utils/SendGetRequestTMDB.java'
          replace_once(tmdb,
              'System.out.println("file with no tmdb info" + movie);\n            DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);',
              'System.out.println("file with no tmdb info" + movie);\n            ensureFallbackMovieTitle(movie);\n            DatabaseClient.getInstance(context).getAppDatabase().movieDao().insert(movie);')
          search_marker = '    private static String searchMovieOnTmdbByName(String titleExtracted , String yearExtracted) {'
          helper = '''    private static void ensureFallbackMovieTitle(Movie movie) {
              if (movie == null || (movie.getTitle() != null && !movie.getTitle().trim().isEmpty())) return;
              String name = movie.getFileName();
              if (name == null || name.trim().isEmpty()) name = "Untitled Video";
              int dot = name.lastIndexOf('.');
              if (dot > 0) name = name.substring(0, dot);
              name = name.replace('.', ' ').replace('_', ' ').replaceAll("\\s+", " ").trim();
              if (name.isEmpty()) name = "Untitled Video";
              movie.setTitle(name);
              movie.setOriginal_title(name);
          }

          '''
          replace_once(tmdb, search_marker, helper + search_marker)
          replace_once(tmdb,
              'movie = gson.fromJson(responseById.toString() , Movie.class);\n        } catch (NumberFormatException e) {\n            System.out.println("NumberFormatException" + e);\n        }',
              'Movie parsedMovie = gson.fromJson(responseById.toString() , Movie.class);\n            if (parsedMovie != null) movie = parsedMovie;\n            else ensureFallbackMovieTitle(movie);\n        } catch (Exception e) {\n            System.out.println("TMDB movie parse failed " + e);\n            ensureFallbackMovieTitle(movie);\n        }')

          Path('app/src/main/java/com/miracle/kglaynyi/utils/IndexUtils.java').write_text('''package com.miracle.kglaynyi.utils;

          import static com.miracle.kglaynyi.utils.SendPostRequest.postRequestGDIndex;
          import static com.miracle.kglaynyi.utils.SendPostRequest.postRequestGoIndex;
          import static com.miracle.kglaynyi.utils.SendPostRequest.postRequestMapleIndex;
          import static com.miracle.kglaynyi.utils.SendPostRequest.postRequestSimpleProgramIndex;
          import static com.miracle.kglaynyi.utils.SendPostRequest.resetPagingState;

          import android.content.Context;
          import com.miracle.kglaynyi.database.DatabaseClient;
          import com.miracle.kglaynyi.model.IndexLink;
          import com.miracle.kglaynyi.model.TVShowInfo.Episode;
          import com.miracle.kglaynyi.model.TVShowInfo.TVShow;
          import com.miracle.kglaynyi.model.TVShowInfo.TVShowSeasonDetails;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;

          public class IndexUtils {
              private static final Map<Integer, GdiJsIndexClient.Progress> SCAN_PROGRESS = new ConcurrentHashMap<>();

              public static GdiJsIndexClient.Progress getScanProgress(int indexId) { return SCAN_PROGRESS.get(indexId); }
              public static boolean refreshIndex(Context c, IndexLink i) { return refreshIndex(c, i, null); }

              public static boolean refreshIndex(Context c, IndexLink i, GdiJsIndexClient.ProgressListener listener) {
                  Thread thread = new Thread(() -> {
                      int progressId = i.getId();
                      try {
                          String folderType=i.getFolderType(), type=i.getIndexType(), link=i.getLink(), user=i.getUsername(), pass=i.getPassword();
                          IndexLink saved=DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().find(link);
                          if(saved==null){ DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().insert(i); saved=DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().find(link); }
                          if(saved==null){ publish(progressId,listener,GdiJsIndexClient.Progress.failed("Could not find saved index")); return; }
                          int id=saved.getId(); progressId=id; boolean tv="TVShows".equals(folderType);
                          if("GDI-JS".equals(type)){
                              final int scanId=id;
                              GdiJsIndexClient.scan(link,user,pass,tv,id,p->publish(scanId,listener,p));
                              return;
                          }
                          publish(id,listener,GdiJsIndexClient.Progress.status("Refreshing index…",-1,0,0,0,0,0,0));
                          resetPagingState();
                          if("GDIndex".equals(type)) postRequestGDIndex(link,user,pass,tv,id);
                          else if("GoIndex".equals(type)) postRequestGoIndex(link,user,pass,tv,id);
                          else if("MapleIndex".equals(type)||"Maple".equals(type)) postRequestMapleIndex(link,user,pass,tv,id);
                          else if("SimpleProgram".equals(type)) postRequestSimpleProgramIndex(link,user,pass,tv,id);
                          int count=getNoOfMedia(c,saved);
                          publish(id,listener,GdiJsIndexClient.Progress.done("Refresh complete • "+count+" items",count,0,count));
                      }catch(Exception e){ String m=e.getMessage(); if(m==null||m.trim().isEmpty())m=e.getClass().getSimpleName(); publish(progressId,listener,GdiJsIndexClient.Progress.failed("Refresh failed • "+m)); }
                  });
                  thread.start(); return thread.isAlive();
              }
              private static void publish(int id,GdiJsIndexClient.ProgressListener l,GdiJsIndexClient.Progress p){ SCAN_PROGRESS.put(id,p); if(l!=null)l.onProgress(p); }

              public static boolean deleteIndex(Context c,IndexLink i){
                  Thread t=new Thread(()->{
                      if("Movies".equals(i.getFolderType())) DatabaseClient.getInstance(c).getAppDatabase().movieDao().deleteAllFromthisIndex(i.getId());
                      if("TVShows".equals(i.getFolderType())){
                          DatabaseClient.getInstance(c).getAppDatabase().episodeDao().deleteAllFromThisIndex(i.getId());
                          List<TVShowSeasonDetails> ss=DatabaseClient.getInstance(c).getAppDatabase().tvShowSeasonDetailsDao().getAll();
                          for(TVShowSeasonDetails s:ss){ List<Episode> es=DatabaseClient.getInstance(c).getAppDatabase().episodeDao().getFromSeasonOnly(s.getId()); if(es==null||es.isEmpty())DatabaseClient.getInstance(c).getAppDatabase().tvShowSeasonDetailsDao().deleteById(s.getId()); }
                          List<TVShow> shows=DatabaseClient.getInstance(c).getAppDatabase().tvShowDao().getAll();
                          for(TVShow s:shows){ List<TVShowSeasonDetails> ss2=DatabaseClient.getInstance(c).getAppDatabase().tvShowSeasonDetailsDao().findByShowId(s.getId()); if(ss2==null||ss2.isEmpty())DatabaseClient.getInstance(c).getAppDatabase().tvShowDao().deleteById(s.getId()); }
                      }
                      DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().deleteById(i.getId()); SCAN_PROGRESS.remove(i.getId());
                  }); t.start(); try{t.join();}catch(InterruptedException e){Thread.currentThread().interrupt();} return t.isAlive();
              }
              public static int getNoOfMedia(Context c,IndexLink i){ final int[] r={0}; Thread t=new Thread(()->{ if("Movies".equals(i.getFolderType()))r[0]=DatabaseClient.getInstance(c).getAppDatabase().movieDao().getNoOfMovies(i.getId()); if("TVShows".equals(i.getFolderType()))r[0]=DatabaseClient.getInstance(c).getAppDatabase().episodeDao().getNoOfShows(i.getId()); }); t.start(); try{t.join();}catch(InterruptedException e){Thread.currentThread().interrupt();} return r[0]; }
              public static void disableIndex(Context c,IndexLink i){ new Thread(()->{if("Movies".equals(i.getFolderType()))DatabaseClient.getInstance(c).getAppDatabase().movieDao().disableFromThisIndex(i.getId()); if("TVShows".equals(i.getFolderType()))DatabaseClient.getInstance(c).getAppDatabase().episodeDao().disableFromThisIndex(i.getId()); DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().disableIndex(i.getId());}).start(); }
              public static void enableIndex(Context c,IndexLink i){ new Thread(()->{if("Movies".equals(i.getFolderType()))DatabaseClient.getInstance(c).getAppDatabase().movieDao().enableFromThisIndex(i.getId()); if("TVShows".equals(i.getFolderType()))DatabaseClient.getInstance(c).getAppDatabase().episodeDao().enableFromThisIndex(i.getId()); DatabaseClient.getInstance(c).getAppDatabase().indexLinksDao().enableIndex(i.getId());}).start(); }
          }
          ''')

          Path('app/src/main/java/com/miracle/kglaynyi/adapter/IndexAdapter.java').write_text('''package com.miracle.kglaynyi.adapter;
          import static com.miracle.kglaynyi.utils.IndexUtils.*;
          import android.content.Context; import android.os.Handler; import android.os.Looper; import android.view.*; import android.widget.*;
          import androidx.appcompat.widget.SwitchCompat; import androidx.recyclerview.widget.RecyclerView;
          import com.miracle.kglaynyi.R; import com.miracle.kglaynyi.model.IndexLink; import com.miracle.kglaynyi.utils.GdiJsIndexClient; import java.util.List;
          public class IndexAdapter extends RecyclerView.Adapter<IndexAdapter.IndexViewHolder>{
              private final Context mCtx; private final List<IndexLink> list; private final Handler h=new Handler(Looper.getMainLooper());
              public IndexAdapter(Context c,List<IndexLink> l){mCtx=c;list=l;}
              public IndexViewHolder onCreateViewHolder(ViewGroup p,int v){return new IndexViewHolder(LayoutInflater.from(mCtx).inflate(R.layout.index_item,p,false));}
              public void onBindViewHolder(IndexViewHolder x,int pos){
                  IndexLink i=list.get(pos); x.textViewLink.setText(i.getLink());x.indexType.setText(i.getIndexType());x.folderType.setText(i.getFolderType()); bind(x,i);
                  x.refreshIndex.setOnClickListener(v->{Context c=x.itemView.getContext();x.refreshIndex.setEnabled(false);x.noOfMedia.setText("Connecting…");refreshIndex(c,i,p->{if(p.finished&&!p.error){int n=getNoOfMedia(c,i);h.post(()->Toast.makeText(c,"Scan complete: "+n+" "+i.getFolderType(),Toast.LENGTH_SHORT).show());}else if(p.error)h.post(()->Toast.makeText(c,p.message,Toast.LENGTH_LONG).show());});if(x.r!=null)h.postDelayed(x.r,200);});
                  x.delete.setOnClickListener(v->{if(!deleteIndex(x.itemView.getContext(),i))Toast.makeText(v.getContext(),"Deleted",Toast.LENGTH_LONG).show();});
                  x.enableIndex.setOnCheckedChangeListener(null);x.enableIndex.setChecked(i.getDisabled()!=1);x.enableIndex.setOnCheckedChangeListener((b,on)->{if(on)enableIndex(x.itemView.getContext(),i);else disableIndex(x.itemView.getContext(),i);});
              }
              private void bind(IndexViewHolder x,IndexLink i){if(x.r!=null)h.removeCallbacks(x.r);x.bound=i.getId();x.r=new Runnable(){public void run(){if(x.getBindingAdapterPosition()==RecyclerView.NO_POSITION||x.bound!=i.getId())return;GdiJsIndexClient.Progress p=getScanProgress(i.getId());if(p!=null&&!p.finished){x.noOfMedia.setText(p.message);x.refreshIndex.setEnabled(false);h.postDelayed(this,500);}else if(p!=null&&p.error){x.noOfMedia.setText(p.message);x.refreshIndex.setEnabled(true);}else{x.noOfMedia.setText(getNoOfMedia(x.itemView.getContext(),i)+" "+i.getFolderType());x.refreshIndex.setEnabled(true);}}};x.r.run();}
              public void onViewRecycled(IndexViewHolder x){if(x.r!=null)h.removeCallbacks(x.r);super.onViewRecycled(x);} public int getItemCount(){return list==null?0:list.size();}
              protected class IndexViewHolder extends RecyclerView.ViewHolder implements View.OnClickListener{TextView textViewLink,indexType,folderType,noOfMedia;ImageButton refreshIndex,delete;SwitchCompat enableIndex;Runnable r;int bound;IndexViewHolder(View v){super(v);textViewLink=v.findViewById(R.id.textViewLink);indexType=v.findViewById(R.id.indexTypeInIndexAdapter);folderType=v.findViewById(R.id.folderTypeInIndexAdapter);noOfMedia=v.findViewById(R.id.noOfMedia);refreshIndex=v.findViewById(R.id.refreshButton);delete=v.findViewById(R.id.deletebutton);enableIndex=v.findViewById(R.id.enableIndexToggle);v.setOnClickListener(this);}public void onClick(View v){}}
          }
          ''')

          lib='app/src/main/java/com/miracle/kglaynyi/fragments/MovieLibraryFragment.java'
          replace_once(lib,'if(movieList ==null){\n\n                    movieList = DatabaseClient','movieList = DatabaseClient')
          replace_once(lib,'.movieDao().getAll();\n                }\n                showRecyclerMovies(movieList);','.movieDao().getAll();\n                showRecyclerMovies(movieList);')
          marker='    void showLibraryMovies() {'
          replace_once(lib,marker,'    @Override\n    public void onResume() {\n        super.onResume();\n        if (getView() != null) showLibraryMovies();\n    }\n\n'+marker)

          home='app/src/main/java/com/miracle/kglaynyi/fragments/HomeFragment.java'
          old='''        loadRecentlyAddedMovies();
              loadRecentlyReleasedMovies();
              loadTopRatedMovies();
              loadLastPlayedMovies();
              loadWatchlist();
              loadNewSeason();
              loadTopRatedShows();
              setOnClickListner();'''
          replace_once(home,old,'        setOnClickListner();\n        refreshHomeContent();')
          marker='    private void loadWatchlist() {'
          helper='''    @Override
              public void onResume() {
              super.onResume();
              if (getView() != null) refreshHomeContent();
          }

              private void refreshHomeContent() {
              loadRecentlyAddedMovies(); loadRecentlyReleasedMovies(); loadTopRatedMovies();
              loadLastPlayedMovies(); loadWatchlist(); loadNewSeason(); loadTopRatedShows();
          }

          '''
          replace_once(home,marker,helper+marker)

          replace_once('app/build.gradle','versionCode 7\n        versionName "1.0.13"','versionCode 8\n        versionName "1.0.14"')
          rp=Path('.github/workflows/release-apk.yml'); txt=rp.read_text(); lines=txt.splitlines();
          for n,line in enumerate(lines):
              if line.strip().startswith('NOTES="'):
                  lines[n]='          NOTES="Fixes movie/poster loading, persistent scan progress across tabs, and faster visible library updates during GDI-JS scans."';break
          else: raise SystemExit('NOTES line missing')
          rp.write_text('\n'.join(lines)+'\n')
          PY

      - name: Build and validate
        run: ./gradlew assembleDebug --stacktrace

      - name: Clean old release-note boilerplate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            body="$(gh release view "$tag" --json body --jq '.body // ""')"
            cleaned="$(printf '%s' "$body" | sed -E 's/[[:space:]]*Package: com\.miracle\.kglaynyi\. Based on Thunder by anujd64 and distributed under GPL-3\.0\.//g')"
            [ "$cleaned" = "$body" ] || gh release edit "$tag" --notes "$cleaned"
          done

      - name: Commit tested fixes
        run: |
          rm -f .github/workflows/fix-v1014.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix library population and persistent scan progress"
          git push origin HEAD:main
