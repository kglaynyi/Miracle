name: Validate Miracle v1.0.17 live library

on:
  push:
    branches:
      - fix-v1017-live-library
    paths:
      - '.github/fix_v1017.py'
      - '.github/workflows/validate-v1017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify TMDB key
        shell: bash
        run: |
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::error::TMDB_API_KEY is missing"
            exit 1
          fi

      - name: Apply v1.0.17 fixes
        run: python3 .github/fix_v1017.py

      - name: Build and validate APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated source changes
        id: commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/com/miracle/kglaynyi/fragments/MovieLibraryFragment.java \
            app/src/main/java/com/miracle/kglaynyi/fragments/TvShowsLibraryFragment.java \
            app/src/main/java/com/miracle/kglaynyi/fragments/AnimeLibraryFragment.java \
            app/src/main/java/com/miracle/kglaynyi/utils/IndexUtils.java \
            app/src/main/java/com/miracle/kglaynyi/utils/GdiJsIndexClient.java
          git commit -m "Keep library visible and refresh it during scans"
          echo "validated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:fix-v1017-live-library

      - name: Publish validated commit to main
        shell: bash
        run: |
          set -e
          VALIDATED_SHA="${{ steps.commit.outputs.validated_sha }}"
          git fetch origin main
          git checkout -B publish-v1017 origin/main
          git cherry-pick "$VALIDATED_SHA"
          git push origin HEAD:main
