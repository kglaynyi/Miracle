name: Publish Miracle v1.0.17 APK

on:
  push:
    branches:
      - fix-v1017-live-library
    paths:
      - '.github/workflows/validate-v1017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify TMDB key
        shell: bash
        run: |
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::error::TMDB_API_KEY is missing"
            exit 1
          fi

      - name: Prepare stable test signing directory
        run: mkdir -p ~/.android

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: miracle-debug-signing-key-v1

      - name: Build installable APK from main
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify and prepare v1.0.17 APK
        shell: bash
        run: |
          set -e
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [[ "$VERSION_NAME" != "1.0.17" ]]; then
            echo "::error::Expected main version 1.0.17, got $VERSION_NAME"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Miracle-v1.0.17.apk
          test -s Miracle-v1.0.17.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          NOTES="Keeps the library visible during discovery and refreshes Movies, TV Shows, and Anime automatically while scan metadata is rebuilt."
          if gh release view v1.0.17 >/dev/null 2>&1; then
            gh release upload v1.0.17 Miracle-v1.0.17.apk --clobber
          else
            gh release create v1.0.17 Miracle-v1.0.17.apk \
              --target main \
              --title "Miracle v1.0.17" \
              --notes "$NOTES"
          fi
