name: Patch inline player tracks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-inline-player-tracks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Fix ExoPlayer track override import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/miracle/kglaynyi/player/PlayerActivity.java')
          s = p.read_text()
          s = s.replace(
              'import com.google.android.exoplayer2.trackselection.TrackSelectionOverrides.TrackSelectionOverride;',
              'import com.google.android.exoplayer2.trackselection.TrackSelectionOverride;')
          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/miracle/kglaynyi/player/PlayerActivity.java
          git commit -m "Fix ExoPlayer inline track override import"
          git push origin HEAD:main
