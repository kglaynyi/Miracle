name: Patch inline player tracks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-inline-player-tracks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Miracle
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply patch
        run: python3 tools/patch_inline_player_tracks.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/miracle/kglaynyi/player/PlayerActivity.java app/src/main/res/layout/activity_player.xml app/build.gradle .github/workflows/release-apk.yml
          git commit -m "Refine direct audio subtitle player controls"
          git push origin HEAD:main
